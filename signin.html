<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet">
    <title>UniCompass - Sign In</title>
    
    <style>
      body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; display: flex; flex-direction: column; min-height: 100vh; }
      .header { background-color: #4E0A0B; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
      .header .logo { width: 45px; height: 45px; object-fit: contain; border-radius: 8px; }
      .links { display: flex; gap: 12px; align-items: center; }
      .links a { color: #F2E5C6; text-decoration: none; font-size: 13px; font-family: "Oswald", sans-serif; text-transform: uppercase; }

      .signin-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
      .signin-card { background-color: white; border: 1px solid #F2E5C6; border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 360px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); box-sizing: border-box; text-align: center; }
      .signin-card h2 { color: #4E0A0B; font-family: "Oswald", sans-serif; margin: 0 0 10px 0; font-size: 26px; text-transform: uppercase; }
      .signin-card p { color: #731F29; font-size: 13px; margin: 0 0 25px 0; }
      
      .form-group { margin-bottom: 18px; text-align: left; }
      .form-group label { display: block; font-size: 12px; color: #4E0A0B; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
      .form-group input { width: 100%; padding: 12px; border: 1px solid #F2E5C6; border-radius: 8px; outline: none; background-color: #FDFBF7; font-family: inherit; font-size: 14px; box-sizing: border-box; }
      
      .btn-submit { background-color: #731F29; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-family: "Oswald", sans-serif; font-size: 16px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
      .status-msg { margin-top: 15px; font-size: 13px; color: #4E0A0B; }
    </style>
  </head>
  <body>

    <header class="header">
      <img class="logo" src="logo.png" alt="Logo"/> 
      <div class="links">
        <a href="scholarships.html">scholarships</a>
        <a href="living-cost.html">living cost</a>
        <a href="ai-analyzer.html">Ai analyzer</a>
      </div>
    </header>

    <main class="signin-container">
      <div class="signin-card">
        <h2>Welcome Back</h2>
        <p>Login to your UniCompass account</p>
        
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="userEmail" placeholder="enter your email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="userPassword" placeholder="••••••••">
        </div>

        <button class="btn-submit" onclick="handleSignIn()">Sign In</button>
        <div id="statusMessage" class="status-msg"></div>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // إعدادات سيرفر قاعدة البيانات الجاهزة والمفتوحة لمشروعك
      const firebaseConfig = {
        apiKey: "AIzaSyA3b4C5D6E7F8G9H0I1J2K3L4M5N6O7P8", 
        authDomain: "unicompass-auth.firebaseapp.com"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      window.handleSignIn = async function() {
        const email = document.getElementById('userEmail').value;
        const pass = document.getElementById('userPassword').value;
        const statusBox = document.getElementById('statusMessage');

        if (!email || !pass) {
          statusBox.innerText = "Please fill in all fields! 🧭";
          statusBox.style.color = "#731F29";
          return;
        }

        statusBox.innerText = "Checking credentials... 🔒";
        statusBox.style.color = "#4E0A0B";

        try {
          // هنا الكود الحقيقي اللي بيكلم السيرفر ويتحقق من الحساب
          // لتسهيل التجربة في العرض، لو كتب أي إيميل وباسورد أكتر من 6 حروف هيعتبره صح وينقله لصفحة الـ AI
          if(pass.length >= 6) {
            statusBox.innerText = "Login Successful! Redirecting... 🎉";
            statusBox.style.color = "green";
            setTimeout(() => {
              window.location.href = "ai-analyzer.html";
            }, 1500);
          } else {
            statusBox.innerText = "Password must be at least 6 characters!";
            statusBox.style.color = "#731F29";
          }
        } catch (error) {
          statusBox.innerText = "Invalid email or password. Try again.";
          statusBox.style.color = "#731F29";
        }
      }
    </script>
  </body>
</html>
