<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Plus+Jakarta+Sans:wght@300..800&display=swap" rel="stylesheet">
    <title>UniCompass - AI Analyzer</title>
    
    <style>
      body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; }
      .header { background-color: #4E0A0B; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
      .header .logo { width: 45px; height: 45px; object-fit: contain; border-radius: 8px; }
      .links { display: flex; gap: 12px; align-items: center; }
      .links a { color: #F2E5C6; text-decoration: none; font-size: 13px; font-family: "Oswald", sans-serif; text-transform: uppercase; }
      .btn-signin { background-color: #E38792; color: #4E0A0B; border: none; padding: 6px 12px; border-radius: 15px; font-family: "Oswald", sans-serif; }

      .ai-hero { background-color: #4E0A0B; padding: 40px 20px; text-align: center; color: #F2E5C6; }
      .ai-hero h1 { font-size: 28px; margin: 0 0 10px 0; font-family: "Oswald", sans-serif; }
      .ai-subtitle { font-size: 14px; color: #E38792; margin: 0; }
      .ai-container { padding: 20px 15px; display: flex; flex-direction: column; gap: 20px; }
      .ai-form-card { background-color: white; border: 1px solid #F2E5C6; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); }
      .ai-form-card h3 { color: #4E0A0B; margin: 0 0 15px 0; font-size: 18px; }
      .form-group { margin-bottom: 15px; }
      .form-group label { display: block; font-size: 13px; color: #4E0A0B; margin-bottom: 6px; font-weight: 500; }
      .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #F2E5C6; border-radius: 8px; outline: none; background-color: #FDFBF7; font-family: inherit; font-size: 14px; box-sizing: border-box; }
      .form-group textarea { resize: none; }
      
      .btn-ai-analyze { background-color: #731F29; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-family: "Oswald", sans-serif; font-size: 15px; cursor: pointer; margin-top: 10px; }
      .ai-result-box { background-color: white; border: 2px dashed #731F29; border-radius: 16px; padding: 20px; min-height: 100px; }
      .ai-result-box h4 { color: #4E0A0B; font-size: 16px; margin: 0 0 10px 0; }
      .initial-msg { font-size: 14px; color: #555; line-height: 1.6; }
    </style>
  </head>
  <body>

    <header class="header">
      <img class="logo" src="logo.png" alt="Logo"/> 
      <div class="links">
        <a href="scholarships.html">scholarships</a>
        <a href="living-cost.html">living cost</a>
        <a href="ai-analyzer.html">Ai analyzer</a>
        <button class="btn-signin">sign in</button>
      </div>
    </header>

    <section class="ai-hero">
      <h1>UniCompass AI Advisor</h1>
      <p class="ai-subtitle">Powered by ChatGPT - Get instant scholarship matching and profile analysis</p>
    </section>

    <section class="ai-container">
      <div class="ai-form-card">
        <h3>📊 Profile & Chat Advisor</h3>
        
        <div class="form-group">
          <label>Your Current GPA</label>
          <input type="number" step="0.01" id="studentGpa" placeholder="e.g. 3.8">
        </div>

        <div class="form-group">
          <label>Target Degree</label>
          <select id="targetDegree">
            <option value="bachelor">Bachelor's Degree</option>
            <option value="master">Master's Degree</option>
          </select>
        </div>

        <div class="form-group">
          <label>Upload Your CV (Optional - .txt file)</label>
          <input type="file" id="studentCv" accept=".txt">
        </div>

        <div class="form-group">
          <label>Message to AI (Ask anything or specify countries)</label>
          <textarea id="studentMessage" rows="3" placeholder="e.g. Tell me about computer science options in Spain or Italy..."></textarea>
        </div>

        <button class="btn-ai-analyze" onclick="startAIAnalysis()">Ask ChatGPT</button>
      </div>

      <div class="ai-result-box">
        <h4>✨ ChatGPT Recommendations</h4>
        <div id="aiOutputText" class="initial-msg">Your analysis will appear here instantly...</div>
      </div>
    </section>

    <script>
      async function startAIAnalysis() {
        const gpa = document.getElementById('studentGpa').value;
        const degree = document.getElementById('targetDegree').value;
        const cvFile = document.getElementById('studentCv').files[0];
        const studentMsg = document.getElementById('studentMessage').value;
        const outputBox = document.getElementById('aiOutputText');

        if (!gpa) {
          outputBox.innerText = "Please enter your GPA first! 🧭";
          return;
        }

        outputBox.innerHTML = "ChatGPT is thinking... 🧠✨ Please wait.";

        let cvText = "No CV uploaded.";

        if (cvFile) {
          const reader = new FileReader();
          reader.onload = async function(e) {
            cvText = e.target.result;
            await callChatGPT(gpa, degree, cvText, studentMsg, outputBox);
          };
          reader.readAsText(cvFile);
        } else {
          await callChatGPT(gpa, degree, cvText, studentMsg, outputBox);
        }
      }
      async function callChatGPT(gpa, degree, cvText, studentMsg, outputBox) {
        let promptText = `You are an expert academic advisor. A student with a GPA of ${gpa} wants to pursue a ${degree}. CV content: ${cvText}. `;
        if (studentMsg) {
          promptText += `The student specifically asks: "${studentMsg}". Please answer this first. `;
        }
        promptText += `Provide 3 specific scholarship recommendations worldwide and 2 smart layout tips for their application. Keep the response friendly, cozy, formatted with clear bullets, and use clean simple text without markdown stars.`;

        try {
          // سيرفر nexra المفتوح والمخصص لتطبيقات الموبايل والـ Front-end مباشرة
          const response = await fetch("https://api.nexra.pro/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              messages: [{ role: "user", content: promptText }],
              model: "gpt-4o-mini",
              stream: false
            })
          });

          const data = await response.json();
          
          // التأكد من أن السيرفر رجع بيانات صحيحة
          if (data.choices && data.choices[0] && data.choices[0].message) {
            const aiResponse = data.choices[0].message.content;
            outputBox.innerHTML = aiResponse.replace(/\n/g, "<br>").replace(/\*\*/g, "");
          } else {
            outputBox.innerText = "سيرفر الـ AI مستجيب بس البيانات مش كاملة، اضغطي تاني كده! 🧭";
          }
          
        } catch (error) {
          outputBox.innerText = "حصل مشكلة في الاتصال بالسيرفر الجديد، اتأكدي إنك عملتي حفظ للكود وافتحي الصفحة تاني في كروم! 🧭";
          console.error(error);
        }
      }

    </script>
  </body>
</html>
